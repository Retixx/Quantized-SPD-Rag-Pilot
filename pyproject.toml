[project]
name = "quantized-spd-rag-pilot"
version = "0.1.0"
description = "Go/no-go pilot: does hierarchical multi-agent RAG stay robust under aggressive weight quantization as the number of required document agents grows?"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.5,<3",
  "numpy>=1.24",
  "PyYAML>=6.0",
  "psutil>=5.9",
  "requests>=2.31",
  "sentence-transformers>=2.7,<4",
  "huggingface_hub>=0.23",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
