# Stage B -- precision-by-width test. 12 questions x 3 precisions = 36 predictions.
# Run only if Stage A passes, or after explicit manual approval (--force).
stage: stage_b
requires_stage: stage_a

questions:
  total: 12
  by_width: {2: 4, 3: 4, 4: 4}

conditions: [fixed_verified_evidence]
precisions: [F16, Q8_0, Q4_K_M]
expected_predictions: 36

retrieval:
  top_k: 3
  chunk_tokens: 400
  overlap_tokens: 50
  max_search_rounds: 0

scoring:
  fact_match_threshold: 0.6
  branch_success_threshold: 0.5

analysis:
  primary_estimand: "Does the F16-Q4_K_M gap grow from width 2 to width 4?"
  report:
    - f16_q4_gap_by_width
    - f16_q8_gap_by_width
    - branch_failure_probability_by_width
    - synthesis_loss_by_width
  bootstrap_resamples: 10000
  non_inferiority_margin: 0.05
