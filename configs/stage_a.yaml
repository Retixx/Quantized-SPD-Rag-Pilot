# Stage A -- capability calibration. 6 questions x 3 precisions = 18 predictions.
stage: stage_a
purpose: >
  Decide whether the MultiHop-RAG / Qwen2.5-3B pairing has enough F16 headroom
  to expose quantization effects at all.

questions:
  total: 6
  by_width:
    2: 3          # 3 questions needing 2 documents
    "3_or_4": 3   # 3 questions needing 3 or 4 documents

conditions: [fixed_verified_evidence]
precisions: [F16, Q8_0, Q4_K_M]
expected_predictions: 18

retrieval:
  top_k: 3
  chunk_tokens: 400
  overlap_tokens: 50
  max_search_rounds: 0

scoring:
  fact_match_threshold: 0.6
  branch_success_threshold: 0.5

decision_gate:
  metric: f16_atomic_fact_recall
  # THIS BLOCK IS THE SINGLE SOURCE OF TRUTH for the Stage A calibration bands.
  # Every band is the half-open interval [min, max): min <= recall < max, except
  # the last, which is closed at the top so recall == 1.0 has a home. The bands
  # are exhaustive over [0.0, 1.0] with no gaps and no overlaps, so 0.70 is a
  # CALIBRATION PASS and 0.95 is a POSSIBLE CEILING -- never both, never neither.
  interval_convention: "min <= recall < max; the final band is min <= recall <= max"
  bands:
    - {min: 0.00, max: 0.50, proceed: false, status: "BLOCKED — MODEL/BENCHMARK FLOOR"}
    - {min: 0.50, max: 0.70, proceed: false, status: "MARGINAL — REVIEW PROMPTS AND FAILURES"}
    - {min: 0.70, max: 0.95, proceed: true,  status: "CALIBRATION PASS"}
    - {min: 0.95, max: 1.00, proceed: false, status: "POSSIBLE CEILING — ADD HARDER ITEMS OR DISTRACTORS"}
  note: >
    Screening thresholds. Not claims of formal statistical significance.
    The former separate "CALIBRATION PASS (upper band)" for 0.90-0.95 is gone:
    it was a distinction the README never made and nothing acted on. 0.70-0.95
    is one pass band. `proceed` is the band's contribution to the Stage B gate;
    it is necessary, not sufficient — the hard scientific gates still apply.
